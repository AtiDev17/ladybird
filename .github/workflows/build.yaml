name: Multi-OS Build Pipeline

on:
  push:
    branches: [ test ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            msvc_arch: x64
            vcpkg_triplet: x64-windows
            artifact_name: ladybird-windows-x64
            runner: windows-latest
          - arch: arm64
            msvc_arch: arm64
            vcpkg_triplet: arm64-windows
            artifact_name: ladybird-windows-arm64
            runner: windows-11-arm
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          os: 'Windows'
          arch: ${{ matrix.arch }}
          toolchain: 'ClangCL'
          type: 'build'

      - name: Setup Windows Specific Tools
        shell: pwsh
        run: |
          $maxRetries = 3
          for ($i=1; $i -le $maxRetries; $i++) {
            try { choco install pkgconfiglite ccache -y --allow-empty-checksums; break }
            catch { if ($i -eq $maxRetries) { throw }; Start-Sleep -Seconds 10 }
          }
          if (!(Test-Path "${{ github.workspace }}/vcpkg_cache")) { New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/vcpkg_cache" }

      - name: Restore Caches
        id: cache-restore
        uses: ./.github/actions/cache-restore
        with:
          os: 'Windows'
          arch: ${{ matrix.arch }}
          toolchain: 'ClangCL'
          cache_key_extra: 'NORMAL'
          ccache_path: '${{ github.workspace }}/.ccache'
          vcpkg_cache_path: '${{ github.workspace }}/vcpkg_cache'

      - name: Build
        shell: pwsh
        run: python Meta/ladybird.py build

      - name: Package
        shell: pwsh
        run: |
          $pkgDir = "ladybird-package/Ladybird"
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
          
          cmake --install Build/release --prefix $pkgDir
          
          Copy-Item "Build/release/bin/*.exe" -Destination "$pkgDir/bin/" -Force
          Copy-Item "Build/release/bin/*.dll" -Destination "$pkgDir/bin/" -Force

          $vcpkgBin = "Build/release/vcpkg_installed/${{ matrix.vcpkg_triplet }}/bin"
          if (Test-Path $vcpkgBin) { Copy-Item "$vcpkgBin/*.dll" -Destination "$pkgDir/bin/" -Force }

          $deployTool = Get-ChildItem -Path "Build/release/vcpkg_installed" -Filter "windeployqt.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if ($deployTool) {
              Get-ChildItem -Path "$pkgDir/bin" -Filter "*.exe" | ForEach-Object {
                  $exePath = $_.FullName
                  $process = Start-Process -FilePath $deployTool -ArgumentList "`"$exePath`" --dir `"$pkgDir/bin`" --no-translations --compiler-runtime" -Wait -NoNewWindow -PassThru
              }
          }

          Remove-Item -Path "$pkgDir/bin/vc_redist.${{ matrix.msvc_arch }}.exe" -Force -ErrorAction SilentlyContinue
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" -Destination "$pkgDir/LICENSE.txt" }
          "Commit: ${{ github.sha }}`nBuild Date: $(Get-Date)" | Out-File -FilePath "$pkgDir/version.txt"
          "@echo off`r`nstart `"`" `"%~dp0bin\Ladybird.exe`"" | Out-File -FilePath "$pkgDir/Launch Ladybird.bat" -Encoding ASCII

          $batScript = @"
          <# :
          @echo off
          setlocal
          echo ============================================
          echo      Ladybird Windows Update Tool
          echo ============================================
          powershell -noprofile -executionpolicy bypass -command `"iex ((Get-Content '%~f0') -join \`"`n\`")`"
          pause >nul
          goto :EOF
          #>
          `$ProgressPreference = 'Continue'; `$ErrorActionPreference = 'Stop'
          if (Get-Process Ladybird -ErrorAction SilentlyContinue) { Write-Host `"Error: Ladybird is running. Please close it.`" -ForegroundColor Red; exit 1 }
          `$localCommit = 'unknown'
          if (Test-Path 'version.txt') { `$lines = Get-Content 'version.txt'; if (`$lines[0] -match 'Commit: ([a-f0-9]+)') { `$localCommit = `$matches[1] } }
          
          `$headers = @{ `"User-Agent`" = `"Ladybird-Windows-Updater`" }
          `$releases = try { Invoke-RestMethod -Uri 'https://api.github.com/repos/AtiDev17/ladybird/releases' -Headers `$headers } catch { `$null }
          if (!`$releases) { Write-Host `"Error: Could not connect to API.`" -ForegroundColor Red; exit 1 }
          
          `$release = `$releases[0]
          `$remoteCommit = 'unknown'
          if (`$release.body -match 'Commit: ([a-f0-9]+)') { `$remoteCommit = `$matches[1] }
          
          if (`$localCommit -ne 'unknown' -and `$localCommit -eq `$remoteCommit) { Write-Host `"Already up to date!`" -ForegroundColor Green; exit 0 }
          
          `$asset = `$release.assets | Where-Object { `$_.name -eq '${{ matrix.artifact_name }}.zip' }
          `$hashAsset = `$release.assets | Where-Object { `$_.name -eq '${{ matrix.artifact_name }}.zip.sha256' }
          if (`$asset -and `$hashAsset) {
              `$tmp = Join-Path `$env:TEMP 'LadybirdUpdate'
              if (Test-Path `$tmp) { Remove-Item `$tmp -Recurse -Force }
              New-Item -Type Directory `$tmp | Out-Null
              
              Start-BitsTransfer -Source `$asset.browser_download_url -Destination `"`$tmp\update.zip`"
              Start-BitsTransfer -Source `$hashAsset.browser_download_url -Destination `"`$tmp\update.sha256`"
              
              `$expectedHash = (Get-Content `"`$tmp\update.sha256`").Trim().ToUpper()
              `$actualHash = (Get-FileHash -Path `"`$tmp\update.zip`" -Algorithm SHA256).Hash.ToUpper()
              
              if (`$expectedHash -ne `$actualHash) { Write-Host `"Hash mismatch!`" -ForegroundColor Red; Remove-Item `$tmp -Recurse -Force; exit 1 }
              Expand-Archive -Path `"`$tmp\update.zip`" -DestinationPath `$tmp -Force
              Get-ChildItem -Path `"`$tmp\Ladybird`" | Copy-Item -Destination '.' -Recurse -Force
              Remove-Item `$tmp -Recurse -Force
              Write-Host `"Update successful!`" -ForegroundColor Green
          } else { Write-Host `"Error: Update assets missing.`" -ForegroundColor Red }
          "@
          $batScript | Out-File -FilePath "$pkgDir/Update Ladybird.bat" -Encoding ASCII

          Compress-Archive -Path "ladybird-package/Ladybird" -DestinationPath "${{ matrix.artifact_name }}.zip" -Force
          (Get-FileHash -Path "${{ matrix.artifact_name }}.zip" -Algorithm SHA256).Hash | Out-File -FilePath "${{ matrix.artifact_name }}.zip.sha256" -Encoding ASCII

      - name: Validate Build Stability
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "ladybird-package/Ladybird/bin/Ladybird.exe" -ArgumentList "--headless" -PassThru
          Start-Sleep -Seconds 5
          $proc.Refresh()
          if ($proc.HasExited -and $proc.ExitCode -ne 0) { exit 1 } else { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip*
          retention-days: 14

      - name: Save Caches
        uses: ./.github/actions/cache-save
        if: always()
        with:
          arch: ${{ matrix.arch }}
          ccache_path: '${{ github.workspace }}/.ccache'
          ccache_primary_key: ${{ steps.cache-restore.outputs.ccache_primary_key }}
          vcpkg_cache_path: '${{ github.workspace }}/vcpkg_cache'
          vcpkg_cache_primary_key: ${{ steps.cache-restore.outputs.vcpkg_cache_primary_key }}

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            vcpkg_triplet: x64-linux
            appimage_arch: x86_64
            artifact_name: ladybird-linux-x64
            runner: ubuntu-latest
          - arch: arm64
            vcpkg_triplet: arm64-linux
            appimage_arch: aarch64
            artifact_name: ladybird-linux-arm64
            runner: ubuntu-24.04-arm
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          os: 'Linux'
          arch: ${{ matrix.arch }}
          toolchain: 'Clang'
          type: 'build'

      - name: Install Missing System Tools (ARM64)
        if: matrix.arch == 'arm64'
        run: sudo apt-get update -y && sudo apt-get install -y generate-ninja

      - name: Restore Caches
        id: cache-restore
        uses: ./.github/actions/cache-restore
        with:
          os: 'Linux'
          arch: ${{ matrix.arch }}
          toolchain: 'Clang'
          cache_key_extra: 'NORMAL'
          ccache_path: '${{ github.workspace }}/.ccache'
          vcpkg_cache_path: '${{ github.workspace }}/vcpkg_cache'

      - name: Build
        run: python Meta/ladybird.py build

      - name: Package (AppImage)
        run: |
          export APPDIR="ladybird-AppDir"
          mkdir -p $APPDIR/usr
          
          # Install Ladybird into the AppDir
          cmake --install Build/release --prefix $APPDIR/usr
          
          # Copy shared libraries and preserve symlinks
          mkdir -p $APPDIR/usr/lib
          find Build/release/vcpkg_installed/${{ matrix.vcpkg_triplet }}/lib -name "*.so*" -exec cp -d {} $APPDIR/usr/lib/ \; 2>/dev/null || true
          find Build/release/lib -name "*.so*" -exec cp -d {} $APPDIR/usr/lib/ \; 2>/dev/null || true
          
          # Copy Qt Plugins safely
          if [ -d "Build/release/vcpkg_installed/${{ matrix.vcpkg_triplet }}/plugins" ]; then
              cp -r Build/release/vcpkg_installed/${{ matrix.vcpkg_triplet }}/plugins $APPDIR/usr/
          fi
          
          # Strip debug symbols to reduce file size
          find $APPDIR/usr/lib -name "*.so*" -type f -exec strip --strip-unneeded {} + 2>/dev/null || true
          find $APPDIR/usr/plugins -name "*.so*" -type f -exec strip --strip-unneeded {} + 2>/dev/null || true
          strip --strip-unneeded $APPDIR/usr/bin/Ladybird 2>/dev/null || true
          
          # Copy standard Linux Desktop assets
          cp Meta/CMake/freedesktop/org.ladybird.Ladybird.desktop $APPDIR/
          cp Meta/CMake/freedesktop/org.ladybird.Ladybird.svg $APPDIR/
          
          # Create the AppRun entrypoint
          cat << 'EOF' > $APPDIR/AppRun
          #!/usr/bin/env bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$HERE/usr/lib64:${LD_LIBRARY_PATH}"
          export QT_PLUGIN_PATH="$HERE/usr/plugins"
          exec "$HERE/usr/bin/Ladybird" "$@"
          EOF
          chmod +x $APPDIR/AppRun
          
          # Download appimagetool (Architecture Specific)
          wget -c -nv "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${{ matrix.appimage_arch }}.AppImage"
          chmod +x appimagetool-${{ matrix.appimage_arch }}.AppImage
          ./appimagetool-${{ matrix.appimage_arch }}.AppImage --appimage-extract
          
          # Build the final AppImage!
          ARCH=${{ matrix.appimage_arch }} ./squashfs-root/AppRun $APPDIR ${{ matrix.artifact_name }}.AppImage
          sha256sum ${{ matrix.artifact_name }}.AppImage | awk '{print $1}' > ${{ matrix.artifact_name }}.AppImage.sha256

      - name: Validate Build Stability
        run: |
          export QT_QPA_PLATFORM=offscreen
          ./${{ matrix.artifact_name }}.AppImage --appimage-extract-and-run --headless &
          PID=$!
          sleep 5
          if ! kill -0 $PID 2>/dev/null; then
            wait $PID
            if [ $? -ne 0 ]; then
              echo "Build Failed: Ladybird crashed."
              exit 1
            fi
            echo "Build Verified: Headless mode completed successfully."
          else
            kill $PID
            echo "Build Verified: Process is stable."
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.AppImage*
          retention-days: 14

      - name: Save Caches
        uses: ./.github/actions/cache-save
        if: always()
        with:
          arch: ${{ matrix.arch }}
          ccache_path: '${{ github.workspace }}/.ccache'
          ccache_primary_key: ${{ steps.cache-restore.outputs.ccache_primary_key }}
          vcpkg_cache_path: '${{ github.workspace }}/vcpkg_cache'
          vcpkg_cache_primary_key: ${{ steps.cache-restore.outputs.vcpkg_cache_primary_key }}

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            artifact_name: ladybird-macos-arm64
            runner: macos-26
          - arch: x86_64
            artifact_name: ladybird-macos-x64
            runner: macos-26-intel
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          os: 'macOS'
          arch: ${{ matrix.arch }}
          toolchain: 'Clang'
          type: 'build'

      - name: Restore Caches
        id: cache-restore
        uses: ./.github/actions/cache-restore
        with:
          os: 'macOS'
          arch: ${{ matrix.arch }}
          toolchain: 'Clang'
          cache_key_extra: 'NORMAL'
          ccache_path: '${{ github.workspace }}/.ccache'
          vcpkg_cache_path: '${{ github.workspace }}/vcpkg_cache'

      - name: Build
        run: |
          export CC="$(brew --prefix llvm@21)/bin/clang"
          export CXX="$(brew --prefix llvm@21)/bin/clang++"
          python Meta/ladybird.py build --cc "$CC" --cxx "$CXX"

      - name: Package
        run: |
          mkdir -p ladybird-package
          cp -r Build/release/bin/Ladybird.app ladybird-package/
          echo "Commit: ${{ github.sha }}" > ladybird-package/version.txt
          
          # Native code-signing for macOS multi-process architecture based on debug.plist
          if [ -f "Meta/debug.plist" ]; then
              codesign -s - -v -f --deep --entitlements Meta/debug.plist ladybird-package/Ladybird.app
          else
              codesign -s - -v -f --deep ladybird-package/Ladybird.app
          fi

          # Generate macOS Update script
          cat << 'EOF' > "ladybird-package/Update Ladybird.command"
          #!/usr/bin/env bash
          set -e
          cd "$(dirname "$0")"
          echo "============================================"
          echo "     Ladybird macOS Update Tool"
          echo "============================================"
          if pgrep -x "Ladybird" > /dev/null; then echo "Error: Ladybird is running. Please close it."; exit 1; fi
          
          LOCAL_COMMIT="unknown"
          if [ -f "version.txt" ]; then LOCAL_COMMIT=$(grep "Commit:" version.txt | awk '{print $2}'); fi
          
          API_URL="https://api.github.com/repos/AtiDev17/ladybird/releases"
          LATEST_JSON=$(curl -s -H "User-Agent: Ladybird-Updater" "$API_URL")
          REMOTE_COMMIT=$(echo "$LATEST_JSON" | grep -o '"body": ".*Commit:[a-f0-9]*' | head -1 | awk '{print $NF}')
          
          if [ "$LOCAL_COMMIT" != "unknown" ] && [ "$LOCAL_COMMIT" == "$REMOTE_COMMIT" ]; then echo "Already up to date!"; exit 0; fi
          
          ASSET_NAME="${{ matrix.artifact_name }}.zip"
          ASSET_URL=$(echo "$LATEST_JSON" | grep '"browser_download_url":' | grep "$ASSET_NAME" | head -1 | awk -F'"' '{print $4}')
          HASH_URL=$(echo "$LATEST_JSON" | grep '"browser_download_url":' | grep "$ASSET_NAME.sha256" | head -1 | awk -F'"' '{print $4}')
          if [ -z "$ASSET_URL" ]; then echo "Error: Assets not found."; exit 1; fi
          
          TMP_DIR=$(mktemp -d)
          curl -L -s -o "$TMP_DIR/$ASSET_NAME" "$ASSET_URL"
          curl -L -s -o "$TMP_DIR/$ASSET_NAME.sha256" "$HASH_URL"
          
          cd "$TMP_DIR"
          shasum -a 256 -c "$ASSET_NAME.sha256" || { echo "Hash mismatch!"; exit 1; }
          cd - > /dev/null
          
          unzip -qo "$TMP_DIR/$ASSET_NAME" -d .
          # Remove Apple Quarantine attribute so it runs without "App is damaged" errors
          xattr -rc Ladybird.app || true 
          rm -rf "$TMP_DIR"
          echo "Update successful! You can now launch Ladybird.app"
          EOF
          chmod +x "ladybird-package/Update Ladybird.command"

          cd ladybird-package
          zip -qr ../${{ matrix.artifact_name }}.zip Ladybird.app version.txt "Update Ladybird.command"
          cd ..
          shasum -a 256 ${{ matrix.artifact_name }}.zip | awk '{print $1}' > ${{ matrix.artifact_name }}.zip.sha256

      - name: Validate Build Stability
        run: |
          ./ladybird-package/Ladybird.app/Contents/MacOS/Ladybird --headless &
          PID=$!
          sleep 5
          if ! kill -0 $PID 2>/dev/null; then
            wait $PID
            if [ $? -ne 0 ]; then
              echo "Build Failed: Ladybird crashed."
              exit 1
            fi
            echo "Build Verified: Headless mode completed successfully."
          else
            kill $PID
            echo "Build Verified: Process is stable."
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip*
          retention-days: 14

      - name: Save Caches
        uses: ./.github/actions/cache-save
        if: always()
        with:
          arch: ${{ matrix.arch }}
          ccache_path: '${{ github.workspace }}/.ccache'
          ccache_primary_key: ${{ steps.cache-restore.outputs.ccache_primary_key }}
          vcpkg_cache_path: '${{ github.workspace }}/vcpkg_cache'
          vcpkg_cache_primary_key: ${{ steps.cache-restore.outputs.vcpkg_cache_primary_key }}

  build-android:
    name: Build Android (APK)
    runs-on: macos-26
    continue-on-error: true
    timeout-minutes: 240
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          os: 'Android'
          arch: 'arm64'
          toolchain: 'Clang'
          type: 'build'

      - name: Restore Caches
        id: cache-restore
        uses: ./.github/actions/cache-restore
        with:
          os: 'Android'
          arch: 'arm64'
          toolchain: 'Clang'
          cache_key_extra: 'NORMAL'
          ccache_path: '${{ github.workspace }}/.ccache'
          vcpkg_cache_path: '${{ github.workspace }}/vcpkg_cache'

      - name: Build APK
        env:
          HOME: /Users/runner 
        run: |
          cd UI/Android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ladybird-android-apk
          path: UI/Android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Save Caches
        uses: ./.github/actions/cache-save
        if: always()
        with:
          arch: 'arm64'
          ccache_path: '${{ github.workspace }}/.ccache'
          ccache_primary_key: ${{ steps.cache-restore.outputs.ccache_primary_key }}
          vcpkg_cache_path: '${{ github.workspace }}/vcpkg_cache'
          vcpkg_cache_primary_key: ${{ steps.cache-restore.outputs.vcpkg_cache_primary_key }}

  build-freebsd:
    name: Build FreeBSD (x64 VM)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          
      - name: Install ccache on Host
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Restore Caches (Host)
        id: cache-restore
        uses: ./.github/actions/cache-restore
        with:
          os: 'FreeBSD'
          arch: 'x86_64'
          toolchain: 'Clang'
          cache_key_extra: 'NORMAL'
          ccache_path: '${{ github.workspace }}/.ccache'
          vcpkg_cache_path: '${{ github.workspace }}/vcpkg_cache'

      - name: Build on FreeBSD
        uses: cross-platform-actions/action@v1
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: x86-64
          run: |
            sudo env IGNORE_OSVERSION=yes pkg update -f
            sudo env IGNORE_OSVERSION=yes pkg install -y ccache autoconf-archive automake autoconf bash cmake curl gmake gn libdrm libtool libxcb libxkbcommon libX11 libXrender libXi nasm yasm ninja patchelf pkgconf python3 qt6-base unzip zip rust git llvm19 perl5 diffutils gettext
            export PATH="/usr/local/bin:$PATH"
            export MAKEJOBS=2
            export CC=/usr/local/bin/clang19
            export CXX=/usr/local/bin/clang++19
            export VCPKG_FORCE_SYSTEM_BINARIES=1
            export CMAKE_C_COMPILER_LAUNCHER=ccache
            export CMAKE_CXX_COMPILER_LAUNCHER=ccache
            export CCACHE_DIR="${PWD}/.ccache"
            export CCACHE_BASEDIR="${PWD}"
            export VCPKG_BINARY_SOURCES="clear;files,${PWD}/vcpkg_cache,readwrite"
            python3 Meta/ladybird.py build --cc "$CC" --cxx "$CXX"
            mkdir -p ladybird-package/Ladybird
            cmake --install Build/release --prefix ladybird-package/Ladybird
            tar -czvf ladybird-freebsd-x64.tar.gz -C ladybird-package Ladybird

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ladybird-freebsd-x64
          path: ladybird-freebsd-x64.tar.gz
          retention-days: 14

      - name: Save Caches (Host)
        uses: ./.github/actions/cache-save
        if: always()
        with:
          arch: 'x86_64'
          ccache_path: '${{ github.workspace }}/.ccache'
          ccache_primary_key: ${{ steps.cache-restore.outputs.ccache_primary_key }}
          vcpkg_cache_path: '${{ github.workspace }}/vcpkg_cache'
          vcpkg_cache_primary_key: ${{ steps.cache-restore.outputs.vcpkg_cache_primary_key }}

  build-riscv:
    name: Build Linux (RISC-V 64)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 720 
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install ccache on Host
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Restore Caches (Host)
        id: cache-restore
        uses: ./.github/actions/cache-restore
        with:
          os: 'Linux'
          arch: 'riscv64'
          toolchain: 'Clang'
          cache_key_extra: 'NORMAL'
          ccache_path: '${{ github.workspace }}/.ccache'
          vcpkg_cache_path: '${{ github.workspace }}/vcpkg_cache'

      - name: Emulate RISC-V Build
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: riscv64
          distro: ubuntu24.04
          githubToken: ${{ github.token }}
          setup: |
            mkdir -p "${PWD}/artifacts"
            mkdir -p "${PWD}/.ccache" "${PWD}/vcpkg_cache"
            chmod -R 777 "${PWD}/artifacts" "${PWD}/.ccache" "${PWD}/vcpkg_cache"
          dockerRunArgs: |
            --volume "${PWD}/artifacts:/artifacts"
            --volume "${PWD}/.ccache:${PWD}/.ccache"
            --volume "${PWD}/vcpkg_cache:${PWD}/vcpkg_cache"
          install: |
            apt-get update -y
            apt-get install -y sudo nodejs npm autoconf autoconf-archive automake bison build-essential ccache cmake curl libcurl4-openssl-dev libidn2-dev libpsl-dev fonts-liberation2 git libdrm-dev libegl1-mesa-dev libgl1-mesa-dev libpulse-dev libssl-dev libtool libxkbcommon-dev nasm ninja-build pulseaudio qt6-base-dev qt6-tools-dev-tools tar unzip zip python3 python3-pip rustc cargo
            useradd -m builder
          run: |
            chown -R builder:builder .
            sudo -u builder bash -c '
              set -e 
              export CMAKE_C_COMPILER_LAUNCHER=ccache
              export CMAKE_CXX_COMPILER_LAUNCHER=ccache
              export CCACHE_DIR="${PWD}/.ccache"
              export CCACHE_BASEDIR="${PWD}"
              export VCPKG_BINARY_SOURCES="clear;files,${PWD}/vcpkg_cache,readwrite"
              export MAKEJOBS=2
              export VCPKG_FORCE_SYSTEM_BINARIES=1
              python3 Meta/ladybird.py build
              mkdir -p ladybird-package/Ladybird
              cmake --install Build/release --prefix ladybird-package/Ladybird
              tar -czvf /artifacts/ladybird-linux-riscv64.tar.gz -C ladybird-package Ladybird
            '

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ladybird-linux-riscv64
          path: artifacts/ladybird-linux-riscv64.tar.gz
          retention-days: 14

      - name: Save Caches (Host)
        uses: ./.github/actions/cache-save
        if: always()
        with:
          arch: 'riscv64'
          ccache_path: '${{ github.workspace }}/.ccache'
          ccache_primary_key: ${{ steps.cache-restore.outputs.ccache_primary_key }}
          vcpkg_cache_path: '${{ github.workspace }}/vcpkg_cache'
          vcpkg_cache_primary_key: ${{ steps.cache-restore.outputs.vcpkg_cache_primary_key }}
