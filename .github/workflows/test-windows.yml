name: Test Windows Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_SLOPPINESS: file_macro,locale,time_macros
      CCACHE_DEPEND: "1"
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Restore LLVM Cache
        id: llvm-cache
        uses: actions/cache@v5
        with:
          path: C:\Program Files\LLVM
          key: llvm-${{ hashFiles('.github/actions/setup/action.yml') }}-x64

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          os: 'Windows'
          arch: 'x86_64'
          toolchain: 'ClangCL'
          type: 'build'

      - name: Restore Caches
        id: cache-restore
        uses: ./.github/actions/cache-restore
        with:
          os: 'Windows'
          arch: 'x86_64'
          toolchain: 'ClangCL'
          cache_key_extra: 'NORMAL'
          ccache_path: '${{ github.workspace }}/.ccache'
          vcpkg_cache_path: '${{ github.workspace }}/vcpkg_cache'

      - name: Setup Windows Specific Tools
        shell: pwsh
        run: |
          choco install ccache pkgconfiglite -y --limit-output

      - name: Build
        shell: pwsh
        run: |
          cmake --preset Release -B Build/release -DENABLE_CI_BASELINE_CPU=ON -DCMAKE_BUILD_TYPE=Release -DENABLE_LTO_FOR_RELEASE=OFF -DENABLE_COMPILETIME_FORMAT_CHECK=OFF
          ninja -C Build/release -j $env:NUMBER_OF_PROCESSORS ladybird
