name: Windows Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240
    permissions:
      contents: write 

    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          os: 'Windows'
          arch: 'x86_64'
          toolchain: 'ClangCL'
          type: 'build'

      - name: Restore Caches
        id: cache-restore
        uses: ./.github/actions/cache-restore
        with:
          os: 'Windows'
          arch: 'x86_64'
          toolchain: 'ClangCL'
          cache_key_extra: 'NORMAL'
          ccache_path: '${{ github.workspace }}/.ccache'
          vcpkg_cache_path: '${{ github.workspace }}/vcpkg_cache'

      - name: Setup Windows Specific Tools
        shell: pwsh
        run: |
          $maxRetries = 3
          for ($i=1; $i -le $maxRetries; $i++) {
            try { choco install pkgconfiglite -y; break }
            catch { if ($i -eq $maxRetries) { throw }; Start-Sleep -Seconds 10 }
          }
          
          if (!(Test-Path "${{ github.workspace }}/vcpkg_cache")) { New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/vcpkg_cache" }

      - name: Build
        shell: pwsh
        run: |
          python Meta/ladybird.py build

      - name: Package
        if: success()
        shell: pwsh
        run: |
          $pkgDir = "ladybird-package/Ladybird"
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
          
          cmake --install Build/release --prefix $pkgDir
          
          Copy-Item "Build/release/bin/*.exe" -Destination "$pkgDir/bin/" -Force
          Copy-Item "Build/release/bin/*.dll" -Destination "$pkgDir/bin/" -Force

          $vcpkgBin = "Build/release/vcpkg_installed/x64-windows/bin"
          if (Test-Path $vcpkgBin) {
              Copy-Item "$vcpkgBin/*.dll" -Destination "$pkgDir/bin/" -Force
          }

          $deployTool = Get-ChildItem -Path "Build/release/vcpkg_installed" -Filter "windeployqt.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (Test-Path "$pkgDir/bin/Ladybird.exe") {
              & $deployTool "$pkgDir/bin/Ladybird.exe" --dir "$pkgDir/bin" --no-translations --compiler-runtime
          }

          if (Test-Path "LICENSE") { Copy-Item "LICENSE" -Destination "$pkgDir/LICENSE.txt" }
          
          "Commit: ${{ github.sha }}`nBuild Date: $(Get-Date)" | Out-File -FilePath "$pkgDir/version.txt"

          "@echo off`r`nstart `"`" `"%~dp0bin\Ladybird.exe`"" | Out-File -FilePath "$pkgDir/Launch Ladybird.bat" -Encoding ASCII

          $batScript = @'
          <# :
          @echo off
          setlocal
          echo ============================================
          echo      Ladybird Windows Update Tool
          echo ============================================
          echo.
          echo Please ensure Ladybird is closed before updating.
          echo Checking for updates...

          powershell -noprofile -executionpolicy bypass -command "iex ((Get-Content '%~f0') -join \"`n\")"

          echo.
          echo Press any key to exit...
          pause >nul
          goto :EOF
          #>

          $ProgressPreference = 'Continue'
          $ErrorActionPreference = 'Stop'
          $localCommit = 'unknown'

          if (Test-Path 'version.txt') {
              $lines = Get-Content 'version.txt'
              if ($lines[0] -match 'Commit: ([a-f0-9]+)') { 
                  $localCommit = $matches[1] 
              }
          }

          Write-Host "Local Version:  $localCommit"

          $headers = @{ "User-Agent" = "Ladybird-Windows-Updater" }

          $releases = try { 
              Invoke-RestMethod -Uri 'https://api.github.com/repos/AtiDev17/ladybird/releases' -Headers $headers
          } catch { 
              $null 
          }

          if (!$releases) {
              Write-Host 'Error: Could not connect to GitHub API.' -ForegroundColor Red
              exit 1
          }

          $release = $releases[0]
          $remoteCommit = 'unknown'
          if ($release.body -match 'Commit: ([a-f0-9]+)') { 
              $remoteCommit = $matches[1] 
          }

          Write-Host "Remote Version: $remoteCommit"

          if ($localCommit -ne 'unknown' -and $localCommit -eq $remoteCommit) {
              Write-Host 'Ladybird is already up to date!' -ForegroundColor Green
              exit 0
          }

          Write-Host 'New version detected!' -ForegroundColor Cyan
          $asset = $release.assets | Where-Object { $_.name -eq 'ladybird-windows-x64.zip' }
          $hashAsset = $release.assets | Where-Object { $_.name -eq 'ladybird-windows-x64.zip.sha256' }

          if ($asset) {
              if (!$hashAsset) {
                  Write-Host 'Error: Security hash file not found in the remote release. Aborting to prevent corruption.' -ForegroundColor Red
                  exit 1
              }

              $tmp = Join-Path $env:TEMP 'LadybirdUpdate'
              if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
              New-Item -Type Directory $tmp | Out-Null
              
              Write-Host 'Downloading update...' -ForegroundColor Yellow
              Start-BitsTransfer -Source $asset.browser_download_url -Destination "$tmp\update.zip"
              
              Write-Host 'Downloading verification hash...' -ForegroundColor Yellow
              Start-BitsTransfer -Source $hashAsset.browser_download_url -Destination "$tmp\update.sha256"

              Write-Host 'Verifying download integrity...' -ForegroundColor Yellow
              $expectedHash = (Get-Content "$tmp\update.sha256").Trim().ToUpper()
              $actualHash = (Get-FileHash -Path "$tmp\update.zip" -Algorithm SHA256).Hash.ToUpper()

              if ($expectedHash -ne $actualHash) {
                  Write-Host 'Error: Hash mismatch! The download is corrupted or tampered with. Aborting.' -ForegroundColor Red
                  Write-Host "Expected: $expectedHash" -ForegroundColor Gray
                  Write-Host "Actual:   $actualHash" -ForegroundColor Gray
                  Remove-Item $tmp -Recurse -Force
                  exit 1
              }
              
              Write-Host 'Hash verified successfully.' -ForegroundColor Green
              Write-Host 'Extracting files...' -ForegroundColor Yellow
              
              try {
                  Expand-Archive -Path "$tmp\update.zip" -DestinationPath $tmp -Force
                  
                  Write-Host 'Installing...' -ForegroundColor Yellow
                  if (Test-Path "$tmp\Ladybird") {
                      Get-ChildItem -Path "$tmp\Ladybird" | Copy-Item -Destination '.' -Recurse -Force
                      Write-Host 'Update successful!' -ForegroundColor Green
                  } else {
                      Write-Host 'Error: Update package format is invalid.' -ForegroundColor Red
                  }
              } catch {
                  Write-Host "Error during extraction or installation: $_" -ForegroundColor Red
              } finally {
                  Remove-Item $tmp -Recurse -Force
              }

          } else {
              Write-Host 'Error: No Windows release asset found on GitHub.' -ForegroundColor Red
          }
          '@

          $batScript | Out-File -FilePath "$pkgDir/Update Ladybird.bat" -Encoding ASCII

          Compress-Archive -Path "ladybird-package/Ladybird" -DestinationPath "ladybird-windows-x64.zip" -Force
          $hash = (Get-FileHash -Path "ladybird-windows-x64.zip" -Algorithm SHA256).Hash
          $hash | Out-File -FilePath "ladybird-windows-x64.zip.sha256" -Encoding ASCII

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2.6.2
        if: success() && github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "Latest Windows Build"
          body: "Commit: ${{ github.sha }}" 
          files: |
            ladybird-windows-x64.zip
            ladybird-windows-x64.zip.sha256
          make_latest: true

      - name: Save Caches
        uses: ./.github/actions/cache-save
        if: always()
        with:
          arch: 'x86_64'
          ccache_path: '${{ github.workspace }}/.ccache'
          ccache_primary_key: ${{ steps.cache-restore.outputs.ccache_primary_key }}
          vcpkg_cache_path: '${{ github.workspace }}/vcpkg_cache'
          vcpkg_cache_primary_key: ${{ steps.cache-restore.outputs.vcpkg_cache_primary_key }}
